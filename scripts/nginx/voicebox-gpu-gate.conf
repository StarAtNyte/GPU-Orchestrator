# GPU gate for Voicebox: its GPU-using API calls are refused with 503 while the GPU is in use.
# Included from /etc/nginx/includes/voicebox.conf by scripts/enable_voicebox_gpu_gate.sh.
#
# nginx asks the orchestrator (/gpu/gate): 204 = GPU free, 403 = GPU in use.

location = /_gpu_gate {
    internal;
    proxy_pass http://127.0.0.1:8890/gpu/gate;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_connect_timeout 2s;
    proxy_read_timeout 4s;
}

location @gpu_busy {
    default_type application/json;
    add_header Retry-After 30 always;
    add_header Cache-Control "no-store" always;
    return 503 '{"error":"gpu_unavailable","message":"The GPU is in use right now. Try again when it is free.","retry_after_seconds":30}';
}

# Only the endpoints that actually use the GPU. Regex locations win over the
# /voicebox-api/ prefix location, so everything else is untouched.
location ~ ^/voicebox-api/(generate|transcribe|models/load|providers/start)/?$ {
    auth_request /_gpu_gate;
    error_page 403 = @gpu_busy;     # gate said "in use". If the gate is unreachable nginx returns 500 (fail closed).

    rewrite ^/voicebox-api/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:17493;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    client_max_body_size 500M;
}
