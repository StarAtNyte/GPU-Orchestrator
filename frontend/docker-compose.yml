# GPU Orchestrator Frontend - Linux Server
# Lightweight UI services that poll remote orchestrator

version: '3.8'

services:
  main-dashboard:
    build:
      context: ./main-dashboard
      dockerfile: Dockerfile
    container_name: main-dashboard
    ports:
      - "8810:8888"
    environment:
      - ORCHESTRATOR_URL=http://172.17.0.1:8890
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost}
    networks:
      - frontend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  sdxl-ui:
    build:
      context: ./sdxl-ui
      dockerfile: Dockerfile
    container_name: sdxl-ui
    ports:
      - "8861:7861"
    environment:
      - ORCHESTRATOR_URL=http://172.17.0.1:8890
    networks:
      - frontend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7861/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  z-image-ui:
    build:
      context: ./z-image-ui
      dockerfile: Dockerfile
    container_name: z-image-ui
    ports:
      - "8862:7862"
    environment:
      - ORCHESTRATOR_URL=http://172.17.0.1:8890
    networks:
      - frontend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7862/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  admin-dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    container_name: admin-dashboard
    ports:
      - "8811:8000"
    environment:
      - ORCHESTRATOR_URL=http://172.17.0.1:8890
    networks:
      - frontend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  qwen-image-edit-ui:
    build:
      context: ./qwen-image-edit-ui
      dockerfile: Dockerfile
    container_name: qwen-image-edit-ui
    ports:
      - "8865:7865"
    environment:
      - ORCHESTRATOR_URL=http://172.17.0.1:8890
    networks:
      - frontend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7865/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  qwen-image-variations-ui:
    build:
      context: ./qwen-image-variations-ui
      dockerfile: Dockerfile
    container_name: qwen-image-variations-ui
    ports:
      - "8866:7866"
    environment:
      - ORCHESTRATOR_URL=http://172.17.0.1:8890
    networks:
      - frontend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7866/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  qwen35-chat-ui:
    build:
      context: ./qwen35-chat-ui
      dockerfile: Dockerfile
    container_name: qwen35-chat-ui
    ports:
      - "8867:7867"
    environment:
      - ORCHESTRATOR_URL=http://172.17.0.1:8890
      - REDIS_HOST=172.17.0.1
      - REDIS_PORT=16379
    networks:
      - frontend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7867/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  frontend-network:
    driver: bridge
