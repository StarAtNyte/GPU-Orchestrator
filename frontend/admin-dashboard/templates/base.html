<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <base href="/gpu-polling/admin/">
    <title>{% block title %}GPU Orchestrator Admin{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#200df2",
                        "background-light": "#f6f5f8",
                        "background-dark": "#111022",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        .glassmorphism-card {
            background: rgba(37, 34, 73, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(54, 49, 104, 0.6);
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            max-width: 400px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Skeleton loaders */
        .skeleton-loader {
            position: relative;
            overflow: hidden;
        }

        .skeleton-loader::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: skeleton-loading 1.5s infinite;
        }

        .skeleton-box {
            background: rgba(54, 49, 104, 0.3);
            border-radius: 0.25rem;
            position: relative;
            overflow: hidden;
        }

        .skeleton-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: skeleton-loading 1.5s infinite;
        }

        @keyframes skeleton-loading {
            0% {
                left: -100%;
            }
            100% {
                left: 100%;
            }
        }

        /* Pulsing status indicator */
        .status-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        /* Smooth transitions */
        .transition-all {
            transition: all 0.3s ease;
        }

        /* Copy button tooltip */
        .copy-tooltip {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(-8px);
            padding: 4px 8px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .copy-tooltip.show {
            opacity: 1;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>

<body class="bg-background-light dark:bg-background-dark font-display text-white">
    <div id="notification-container"></div>

    <div class="flex min-h-screen">
        <!-- SideNavBar -->
        <aside class="w-64 flex-shrink-0 bg-[#121023] p-4 flex flex-col justify-between border-r border-[#252249]">
            <div class="flex flex-col gap-8">
                <div class="flex items-center gap-3 px-2">
                    <div class="bg-gradient-to-r from-[#6366f1] to-[#8b5cf6] rounded-full size-10 flex items-center justify-center">
                        <span class="material-symbols-outlined text-white text-2xl">developer_board</span>
                    </div>
                    <div class="flex flex-col">
                        <h1 class="text-white text-base font-medium leading-normal">GPU Orchestrator</h1>
                        <p class="text-[#9590cb] text-sm font-normal leading-normal">Admin Panel</p>
                    </div>
                </div>
                <nav class="flex flex-col gap-2">
                    <a class="flex items-center gap-3 px-3 py-2 rounded-lg {% if active_page == 'dashboard' %}bg-[#252249]{% else %}hover:bg-[#252249]/50{% endif %}"
                        href="dashboard">
                        <span class="material-symbols-outlined text-white"
                            {% if active_page == 'dashboard' %}style="font-variation-settings: 'FILL' 1;"{% endif %}>dashboard</span>
                        <p class="text-white text-sm font-medium leading-normal">Dashboard</p>
                    </a>
                    <a class="flex items-center gap-3 px-3 py-2 rounded-lg {% if active_page == 'jobs' %}bg-[#252249]{% else %}hover:bg-[#252249]/50{% endif %}"
                        href="jobs">
                        <span class="material-symbols-outlined text-white"
                            {% if active_page == 'jobs' %}style="font-variation-settings: 'FILL' 1;"{% endif %}>list_alt</span>
                        <p class="text-white text-sm font-medium leading-normal">Jobs</p>
                    </a>
                    <a class="flex items-center gap-3 px-3 py-2 rounded-lg {% if active_page == 'workers' %}bg-[#252249]{% else %}hover:bg-[#252249]/50{% endif %}"
                        href="workers">
                        <span class="material-symbols-outlined text-white"
                            {% if active_page == 'workers' %}style="font-variation-settings: 'FILL' 1;"{% endif %}>memory</span>
                        <p class="text-white text-sm font-medium leading-normal">Workers</p>
                    </a>
                    <a class="flex items-center gap-3 px-3 py-2 rounded-lg {% if active_page == 'config' %}bg-[#252249]{% else %}hover:bg-[#252249]/50{% endif %}"
                        href="config">
                        <span class="material-symbols-outlined text-white"
                            {% if active_page == 'config' %}style="font-variation-settings: 'FILL' 1;"{% endif %}>settings</span>
                        <p class="text-white text-sm font-medium leading-normal">Config</p>
                    </a>
                </nav>
            </div>
            <div class="flex flex-col gap-1">
                <div class="px-3 py-2 border-t border-[#252249] mb-2">
                    <p class="text-[#9590cb] text-xs font-normal">Logged in as</p>
                    <p class="text-white text-sm font-medium">{{ admin.username }}</p>
                </div>
                <a class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-[#252249]/50" href="logout">
                    <span class="material-symbols-outlined text-white">logout</span>
                    <p class="text-white text-sm font-medium leading-normal">Logout</p>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-8 overflow-y-auto">
            <div class="max-w-7xl mx-auto space-y-8">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <script>
        // Notification system
        function showNotification(message, type = 'success') {
            const container = document.getElementById('notification-container');
            const notification = document.createElement('div');

            const bgColor = type === 'success' ? 'bg-green-500/20 border-green-500/50 text-green-400' :
                           type === 'error' ? 'bg-red-500/20 border-red-500/50 text-red-400' :
                           type === 'warning' ? 'bg-yellow-500/20 border-yellow-500/50 text-yellow-400' :
                           'bg-blue-500/20 border-blue-500/50 text-blue-400';

            const icon = type === 'success' ? 'check_circle' :
                        type === 'error' ? 'error' :
                        type === 'warning' ? 'warning' : 'info';

            notification.className = `notification ${bgColor} border rounded-lg p-4 flex items-center gap-3`;
            notification.innerHTML = `
                <span class="material-symbols-outlined">${icon}</span>
                <span class="flex-1">${message}</span>
                <button onclick="this.parentElement.remove()" class="material-symbols-outlined hover:opacity-70">close</button>
            `;

            container.appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 5000);
        }

        function showError(message) {
            showNotification(message, 'error');
        }

        function showInfo(message) {
            showNotification(message, 'info');
        }

        function showWarning(message) {
            showNotification(message, 'warning');
        }

        // Session timeout warning
        const SESSION_MAX_AGE = 86400; // 24 hours in seconds
        const WARNING_TIME = 300; // Show warning 5 minutes before expiry
        let sessionWarningShown = false;

        function checkSessionTimeout() {
            // Get session start time from cookie or localStorage
            const loginTime = localStorage.getItem('login_time');
            if (!loginTime) {
                // Set login time if not exists
                localStorage.setItem('login_time', Date.now().toString());
                return;
            }

            const elapsed = (Date.now() - parseInt(loginTime)) / 1000;
            const remaining = SESSION_MAX_AGE - elapsed;

            if (remaining <= WARNING_TIME && !sessionWarningShown) {
                const minutes = Math.floor(remaining / 60);
                showWarning(`Your session will expire in ${minutes} minutes. Please save your work.`);
                sessionWarningShown = true;
            } else if (remaining <= 0) {
                showError('Your session has expired. Redirecting to login...');
                setTimeout(() => {
                    window.location.href = '/login';
                }, 2000);
            }
        }

        // Check session timeout every minute
        setInterval(checkSessionTimeout, 60000);
        checkSessionTimeout();

        // Reset login time on user activity
        ['click', 'keypress', 'scroll', 'mousemove'].forEach(event => {
            document.addEventListener(event, () => {
                if (!sessionWarningShown) {
                    localStorage.setItem('login_time', Date.now().toString());
                }
            }, { once: false, passive: true });
        });
    </script>

    {% block extra_scripts %}{% endblock %}
</body>

</html>
