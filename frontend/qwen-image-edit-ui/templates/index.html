<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/gpu-polling/qwen-edit/">
    <title>Qwen Image Edit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --radius: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--gray-50);
            min-height: 100vh;
        }

        .nav {
            background: white;
            border-bottom: 1px solid var(--gray-200);
            padding: 16px 24px;
        }

        .nav-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 18px;
            font-weight: 600;
            color: var(--gray-800);
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-online {
            background: #dcfce7;
            color: #166534;
        }

        .status-offline {
            background: #fee2e2;
            color: #991b1b;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        .two-column-layout {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 24px;
        }

        .left-panel {
            background: white;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            padding: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--gray-700);
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .upload-area {
            border: 2px dashed var(--gray-200);
            border-radius: var(--radius);
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: var(--gray-50);
        }

        .upload-area.has-image {
            padding: 10px;
        }

        .upload-area img {
            max-width: 100%;
            max-height: 200px;
            border-radius: var(--radius);
        }

        .btn {
            width: 100%;
            padding: 14px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--primary-dark);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .right-panel {
            background: white;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            padding: 24px;
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .placeholder {
            text-align: center;
            color: var(--gray-500);
        }

        .placeholder svg {
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .result-image {
            max-width: 100%;
            max-height: 600px;
            border-radius: var(--radius);
        }

        .loading {
            text-align: center;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--gray-200);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .result-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            justify-content: center;
        }

        .btn-secondary {
            padding: 10px 20px;
            background: white;
            color: var(--gray-700);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        .btn-secondary:hover {
            background: var(--gray-50);
        }

        .error-msg {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: var(--radius);
            margin-top: 12px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <nav class="nav">
        <div class="nav-content">
            <div class="logo">Qwen Image Edit</div>
            <div id="statusBadge" class="status-badge status-offline">
                <span id="statusText">Connecting...</span>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="two-column-layout">
            <div class="left-panel">
                <form id="editForm">
                    <div class="form-group">
                        <label>Upload Image</label>
                        <div class="upload-area" id="uploadArea">
                            <input type="file" id="imageInput" accept="image/*" style="display: none;">
                            <div id="uploadPlaceholder">
                                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="1.5">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                                    <polyline points="17 8 12 3 7 8" />
                                    <line x1="12" y1="3" x2="12" y2="15" />
                                </svg>
                                <p style="margin-top: 12px; color: var(--gray-500);">Click to upload or drag and drop</p>
                            </div>
                            <img id="previewImage" style="display: none;">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="prompt">Edit Instruction</label>
                        <textarea id="prompt" placeholder="e.g., change rhino into tiger" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="negativePrompt">Negative Prompt (optional)</label>
                        <input type="text" id="negativePrompt" placeholder="Things to avoid...">
                    </div>

                    <div class="form-group">
                        <label for="steps">Steps (default: 4)</label>
                        <input type="number" id="steps" value="4" min="1" max="20">
                    </div>

                    <button type="submit" class="btn" id="editBtn">Edit Image</button>
                </form>
                <div id="errorMsg" class="error-msg" style="display: none;"></div>
            </div>

            <div class="right-panel">
                <div id="placeholderState" class="placeholder">
                    <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.5">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                        <circle cx="8.5" cy="8.5" r="1.5" />
                        <polyline points="21 15 16 10 5 21" />
                    </svg>
                    <h3>Edited Image Will Appear Here</h3>
                    <p>Upload an image and provide edit instructions</p>
                </div>

                <div id="loadingState" class="loading" style="display: none;">
                    <div class="spinner"></div>
                    <p id="loadingText">Processing...</p>
                    <p id="jobIdDisplay" style="font-size: 12px; color: var(--gray-500); margin-top: 8px;"></p>
                </div>

                <div id="resultState" style="display: none; text-align: center;">
                    <img id="resultImage" class="result-image">
                    <div class="result-actions">
                        <button class="btn-secondary" id="downloadBtn">Download</button>
                        <button class="btn-secondary" id="newBtn">Edit Another</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const imageInput = document.getElementById('imageInput');
        const previewImage = document.getElementById('previewImage');
        const uploadPlaceholder = document.getElementById('uploadPlaceholder');
        const editForm = document.getElementById('editForm');
        const editBtn = document.getElementById('editBtn');
        const errorMsg = document.getElementById('errorMsg');

        const placeholderState = document.getElementById('placeholderState');
        const loadingState = document.getElementById('loadingState');
        const resultState = document.getElementById('resultState');
        const loadingText = document.getElementById('loadingText');
        const jobIdDisplay = document.getElementById('jobIdDisplay');
        const resultImage = document.getElementById('resultImage');
        const downloadBtn = document.getElementById('downloadBtn');
        const newBtn = document.getElementById('newBtn');
        const statusBadge = document.getElementById('statusBadge');
        const statusText = document.getElementById('statusText');

        let imageBase64 = null;

        // Auth check — uses Auth module (auth.js loaded at bottom of body)
        function getUsername() {
            return typeof Auth !== 'undefined' ? Auth.getUsername() : null;
        }

        uploadArea.addEventListener('click', () => imageInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = 'var(--primary)';
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = 'var(--gray-200)';
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = 'var(--gray-200)';
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleImage(file);
            }
        });

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleImage(file);
            }
        });

        function handleImage(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const dataUrl = e.target.result;
                imageBase64 = dataUrl.split(',')[1];
                previewImage.src = dataUrl;
                previewImage.style.display = 'block';
                uploadPlaceholder.style.display = 'none';
                uploadArea.classList.add('has-image');
            };
            reader.readAsDataURL(file);
        }

        editForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';

            if (!imageBase64) {
                errorMsg.textContent = 'Please upload an image first';
                errorMsg.style.display = 'block';
                return;
            }

            if (typeof Auth !== 'undefined' && !Auth.isLoggedIn()) { Auth.showModal(); return; }

            const prompt = document.getElementById('prompt').value;
            const negativePrompt = document.getElementById('negativePrompt').value;
            const steps = parseInt(document.getElementById('steps').value) || 4;

            editBtn.disabled = true;
            placeholderState.style.display = 'none';
            loadingState.style.display = 'block';
            resultState.style.display = 'none';
            loadingText.textContent = 'Submitting...';

            try {
                const headers = typeof Auth !== 'undefined' ? Auth.getAuthHeaders() : { 'Content-Type': 'application/json' };
                const response = await fetch('api/edit', {
                    method: 'POST',
                    headers,
                    body: JSON.stringify({
                        prompt,
                        image_base64: imageBase64,
                        negative_prompt: negativePrompt,
                        steps,
                        cfg_scale: 1.0
                    })
                });

                const data = await response.json();

                if (data.success) {
                    jobIdDisplay.textContent = `Job ID: ${data.job_id}`;
                    loadingText.textContent = 'Processing...';
                    pollStatus(data.job_id);
                } else {
                    throw new Error(data.error || 'Failed to submit job');
                }
            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.style.display = 'block';
                loadingState.style.display = 'none';
                placeholderState.style.display = 'block';
                editBtn.disabled = false;
            }
        });

        async function pollStatus(jobId) {
            try {
                const response = await fetch(`api/status/${jobId}`);
                const data = await response.json();

                if (data.status === 'COMPLETED') {
                    loadingState.style.display = 'none';
                    resultState.style.display = 'block';
                    resultImage.src = `data:image/png;base64,${data.result.image_base64}`;
                    editBtn.disabled = false;
                } else if (data.status === 'FAILED') {
                    throw new Error(data.error || 'Job failed');
                } else {
                    loadingText.textContent = `Status: ${data.status}`;
                    setTimeout(() => pollStatus(jobId), 2000);
                }
            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.style.display = 'block';
                loadingState.style.display = 'none';
                placeholderState.style.display = 'block';
                editBtn.disabled = false;
            }
        }

        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.href = resultImage.src;
            link.download = `qwen-edit-${Date.now()}.png`;
            link.click();
        });

        newBtn.addEventListener('click', () => {
            resultState.style.display = 'none';
            placeholderState.style.display = 'block';
        });

        async function checkHealth() {
            try {
                const response = await fetch('health');
                const data = await response.json();
                if (data.orchestrator === 'connected') {
                    statusBadge.className = 'status-badge status-online';
                    statusText.textContent = 'Connected';
                } else {
                    statusBadge.className = 'status-badge status-offline';
                    statusText.textContent = 'Disconnected';
                }
            } catch {
                statusBadge.className = 'status-badge status-offline';
                statusText.textContent = 'Disconnected';
            }
        }

        checkHealth();
        setInterval(checkHealth, 10000);
    </script>
    <script>window.AUTH_REDIRECT_URL = '/gpu-polling/';</script>
    <script src="static/js/auth.js"></script>
</body>

</html>
