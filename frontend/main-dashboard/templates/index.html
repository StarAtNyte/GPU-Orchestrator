<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU Orchestrator Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">🚀 GPU Orchestrator Hub</div>
            <div class="status-group">
                <div id="gpuStatusBadge" class="status-badge">
                    <span id="gpuStatusIndicator" class="indicator"></span>
                    <span id="gpuStatusText">Checking GPU...</span>
                </div>
                <div id="statusBadge" class="status-badge">
                    <span id="statusText">Connecting...</span>
                </div>
            </div>
        </div>
    </nav>

    <main class="container">
        <!-- Header -->
        <div class="header">
            <h1>GPU Services Hub</h1>
            <p class="subtitle">Access all GPU orchestration services</p>
        </div>

        <!-- GPU Status Card -->
        <div id="gpuCard" class="gpu-card">
            <div class="gpu-header">
                <div class="gpu-icon">🖥️</div>
                <div class="gpu-info">
                    <h3>GPU Status</h3>
                    <p id="gpuDetail">Connecting to orchestrator...</p>
                </div>
            </div>
            <div class="gpu-metrics">
                <div class="metric">
                    <span class="label">Free VRAM</span>
                    <span class="value" id="freeVram">-</span>
                </div>
                <div class="metric">
                    <span class="label">Used VRAM</span>
                    <span class="value" id="usedVram">-</span>
                </div>
                <div class="metric">
                    <span class="label">Utilization</span>
                    <span class="value" id="utilization">-</span>
                </div>
                <div class="metric">
                    <span class="label">Active Jobs</span>
                    <span class="value" id="activeJobs">-</span>
                </div>
            </div>
        </div>

        <!-- Services Grid -->
        <div class="services-section">
            <h2>Available Services</h2>
            <div id="servicesGrid" class="services-grid">
                <div class="loading">Loading services...</div>
            </div>
        </div>

        <!-- Workers Status -->
        <div class="workers-section">
            <h2>Registered Workers</h2>
            <div id="workersList" class="workers-list">
                <div class="loading">Loading workers...</div>
            </div>
        </div>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
