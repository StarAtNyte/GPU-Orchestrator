<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>History - GPU Orchestrator</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "background": "#fafafa",
                    },
                    fontFamily: {
                        "sans": ["-apple-system", "BlinkMacSystemFont", "Segoe UI", "Roboto", "Helvetica Neue", "Arial", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        .card-hover { transition: all 0.15s ease; }
        .card-hover:hover { border-color: #ccc; background: #f5f5f5; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin 2s linear infinite; }
    </style>
</head>

<body class="bg-[#fafafa] text-[#1a1a1a] min-h-screen flex flex-col">
    <!-- TopNavBar -->
    <header class="border-b border-[#e0e0e0] bg-white sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <h1 class="text-xl font-semibold tracking-tight">GPU Orchestrator</h1>
            </div>
            <div class="flex items-center gap-6">
                <a href="./" class="text-sm text-[#666] hover:text-[#1a1a1a] transition-colors">Home</a>
                <div class="flex items-center gap-3">
                    <span class="material-symbols-outlined text-[#666] text-sm">person</span>
                    <span id="currentUsername" class="text-[#666] text-xs font-semibold uppercase tracking-wider">…</span>
                    <button id="signOutBtn" class="text-xs text-[#6b7280] hover:text-[#111] underline">Sign out</button>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow px-6 py-12">
        <!-- PageHeading -->
        <div class="text-center mb-12 max-w-2xl mx-auto">
            <h2 class="text-4xl md:text-5xl font-bold mb-4 tracking-tight">Your History</h2>
            <p class="text-[#666] text-lg">View all your past submissions and results.</p>
        </div>

        <!-- Filters -->
        <div class="max-w-7xl mx-auto mb-8">
            <div class="bg-white border border-[#e0e0e0] rounded-xl p-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="text-xs text-[#999] uppercase tracking-widest font-semibold mb-2 block">Service</label>
                        <select id="filterService" onchange="loadJobs()" class="w-full px-4 py-2 bg-[#fafafa] border border-[#e0e0e0] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#1a1a1a] text-sm">
                            <option value="">All Services</option>
                            <option value="sdxl-image-gen">SDXL Image Gen</option>
                            <option value="z-image">Z-Image</option>
                            <option value="qwen-image-variations">Qwen Variations</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-[#999] uppercase tracking-widest font-semibold mb-2 block">Status</label>
                        <select id="filterStatus" onchange="loadJobs()" class="w-full px-4 py-2 bg-[#fafafa] border border-[#e0e0e0] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#1a1a1a] text-sm">
                            <option value="">All Status</option>
                            <option value="COMPLETED">Completed</option>
                            <option value="PROCESSING">Processing</option>
                            <option value="QUEUED">Queued</option>
                            <option value="FAILED">Failed</option>
                        </select>
                    </div>
                    <div class="flex items-end">
                        <button onclick="loadJobs()" class="w-full bg-[#1a1a1a] hover:bg-[#333] text-white font-medium py-2 px-6 rounded-lg transition-colors flex items-center justify-center gap-2 text-sm">
                            <span class="material-symbols-outlined text-base">refresh</span>
                            <span>Refresh</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Jobs Count -->
        <div class="max-w-7xl mx-auto mb-6">
            <p class="text-[#999] text-sm">
                <span id="jobCount" class="text-[#1a1a1a] font-semibold">0</span> submissions found
            </p>
        </div>

        <!-- Jobs Grid -->
        <div class="max-w-7xl mx-auto">
            <div id="jobsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                <div class="text-center text-[#aaa] py-12 col-span-full">Loading your history...</div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="mt-auto border-t border-[#e0e0e0] bg-white py-6">
        <div class="max-w-7xl mx-auto px-6 flex items-center justify-between">
            <p class="text-[#aaa] text-sm">&copy; 2025 GPU Orchestrator</p>
            <a class="text-[#aaa] hover:text-[#666] text-sm transition-colors" href="./">Home</a>
        </div>
    </footer>

    <script>
        const TOKEN_KEY = 'gpu_auth_token';
        function getToken() { return localStorage.getItem(TOKEN_KEY); }
        function clearToken() { localStorage.removeItem(TOKEN_KEY); }
        function decodePayload(token) {
            try { const p = token.split('.'); return p.length===3 ? JSON.parse(atob(p[1].replace(/-/g,'+').replace(/_/g,'/'))) : null; }
            catch { return null; }
        }
        function getUsername() {
            const t = getToken(); if (!t) return null;
            const p = decodePayload(t); return p ? p.username : null;
        }
        function isLoggedIn() {
            const t = getToken(); if (!t) return false;
            const p = decodePayload(t); if (!p) return false;
            if (p.exp && Date.now()/1000 > p.exp) { clearToken(); return false; }
            return true;
        }
        function getAuthHeaders() {
            return { 'Authorization': 'Bearer ' + (getToken() || '') };
        }

        document.getElementById('signOutBtn').addEventListener('click', () => { clearToken(); window.location.href = './'; });

        // Redirect to login if not authenticated
        if (!isLoggedIn()) { window.location.href = './?return=' + encodeURIComponent(window.location.href); }

        function getStatusBadge(status) {
            const map = {
                'COMPLETED':  { icon: 'check_circle',      color: '#22c55e' },
                'PROCESSING': { icon: 'progress_activity',  color: '#3b82f6', spin: true },
                'QUEUED':     { icon: 'schedule',           color: '#eab308' },
                'FAILED':     { icon: 'error',              color: '#ef4444' },
                'PENDING':    { icon: 'pending',            color: '#aaa' },
            };
            const s = map[status] || { icon: 'help', color: '#aaa' };
            const spinClass = s.spin ? ' animate-spin-slow' : '';
            return `<span class="inline-flex items-center gap-1 text-xs font-medium" style="color:${s.color}">
                <span class="material-symbols-outlined text-xs${spinClass}">${s.icon}</span>${status.charAt(0) + status.slice(1).toLowerCase()}
            </span>`;
        }

        function getServiceName(appId) {
            const names = {
                'sdxl-image-gen': 'SDXL',
                'z-image': 'Z-Image',
                'qwen-image-variations': 'Qwen Variations'
            };
            return names[appId] || appId;
        }

        function getServiceMaterialIcon(appId) {
            const icons = {
                'sdxl-image-gen': 'image_search',
                'z-image': 'blur_on',
                'qwen-image-variations': 'image_search'
            };
            return icons[appId] || 'apps';
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;
            const seconds = Math.floor(diff / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);

            if (seconds < 60) return 'Just now';
            if (minutes < 60) return `${minutes}m ago`;
            if (hours < 24) return `${hours}h ago`;
            if (days < 7) return `${days}d ago`;
            return date.toLocaleDateString();
        }

        function getMediaType(output) {
            if (output.media_type) return output.media_type;
            if (output.image || output.image_base64) return 'image';
            if (output.video || output.video_base64) return 'video';
            if (output.audio || output.audio_base64) return 'audio';
            if (output.images) return 'image';
            return 'unknown';
        }

        function getMediaData(output) {
            return output.image || output.image_base64 ||
                   output.video || output.video_base64 ||
                   output.audio || output.audio_base64 ||
                   (output.images && output.images[0]) || null;
        }

        async function deleteJob(jobId, event) {
            event.stopPropagation();
            if (!confirm('Remove this job from your history?')) return;

            try {
                const response = await fetch(`api/user/jobs/${jobId}`, {
                    method: 'DELETE',
                    headers: getAuthHeaders()
                });
                if (response.ok) {
                    loadJobs();
                } else {
                    const error = await response.json();
                    alert('Failed to delete job: ' + (error.detail || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error deleting job:', error);
                alert('Failed to delete job');
            }
        }

        function renderJobCard(job) {
            const hasOutput = job.status === 'COMPLETED' && (job.output || job.result);
            let mediaPreview = '';

            if (hasOutput) {
                const output = job.output || job.result;
                const mediaType = getMediaType(output);
                const mediaData = getMediaData(output);

                if (mediaData && mediaType === 'image') {
                    const imageSrc = mediaData.startsWith('data:') ? mediaData : `data:image/png;base64,${mediaData}`;
                    mediaPreview = `
                        <div class="aspect-video w-full bg-[#f0f0f0] rounded-lg overflow-hidden mb-4 relative group">
                            <img src="${imageSrc}" alt="Generated image" class="w-full h-full object-cover" />
                            <button onclick="deleteJob('${job.job_id}', event)" class="absolute top-2 right-2 p-1.5 bg-white/80 hover:bg-white text-[#666] hover:text-red-500 rounded-lg opacity-0 group-hover:opacity-100 transition-all border border-[#e0e0e0]" title="Remove">
                                <span class="material-symbols-outlined text-sm">delete</span>
                            </button>
                        </div>`;
                } else if (mediaData) {
                    const icon = mediaType === 'video' ? 'movie' : 'music_note';
                    mediaPreview = `
                        <div class="aspect-video w-full bg-[#f0f0f0] rounded-lg overflow-hidden mb-4 flex items-center justify-center relative group">
                            <span class="material-symbols-outlined text-5xl text-[#ccc]">${icon}</span>
                            <button onclick="deleteJob('${job.job_id}', event)" class="absolute top-2 right-2 p-1.5 bg-white/80 hover:bg-white text-[#666] hover:text-red-500 rounded-lg opacity-0 group-hover:opacity-100 transition-all border border-[#e0e0e0]" title="Remove">
                                <span class="material-symbols-outlined text-sm">delete</span>
                            </button>
                        </div>`;
                }
            }

            if (!mediaPreview) {
                mediaPreview = `
                    <div class="aspect-video w-full bg-[#f5f5f5] rounded-lg overflow-hidden mb-4 flex items-center justify-center relative group">
                        <span class="material-symbols-outlined text-5xl text-[#ccc]">${getServiceMaterialIcon(job.app_id)}</span>
                        <button onclick="deleteJob('${job.job_id}', event)" class="absolute top-2 right-2 p-1.5 bg-white/80 hover:bg-white text-[#666] hover:text-red-500 rounded-lg opacity-0 group-hover:opacity-100 transition-all border border-[#e0e0e0]" title="Remove">
                            <span class="material-symbols-outlined text-sm">delete</span>
                        </button>
                    </div>`;
            }

            const prompt = job.params?.prompt || job.params?.text || 'No prompt';
            const truncatedPrompt = prompt.length > 80 ? prompt.substring(0, 80) + '...' : prompt;

            return `
                <div class="bg-white border border-[#e0e0e0] rounded-xl p-5 card-hover cursor-pointer" onclick="viewJobDetails('${job.job_id}')">
                    ${mediaPreview}
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs text-[#999] font-semibold uppercase tracking-wider">${getServiceName(job.app_id)}</span>
                        ${getStatusBadge(job.status)}
                    </div>
                    <p class="text-sm text-[#555] mb-3 line-clamp-2">${truncatedPrompt}</p>
                    <div class="flex items-center gap-2 text-xs text-[#aaa]">
                        <span class="material-symbols-outlined text-xs">schedule</span>
                        <span>${formatDate(job.created_at)}</span>
                    </div>
                    ${job.error_log ? `<p class="mt-2 text-xs text-red-500">${job.error_log}</p>` : ''}
                </div>`;
        }

        function viewJobDetails(jobId) {
            fetch(`api/user/jobs/${jobId}`, { headers: getAuthHeaders() })
                .then(res => res.json())
                .then(job => {
                    const output = job.result || job.output;
                    const mediaType = output ? getMediaType(output) : 'unknown';
                    const mediaData = output ? getMediaData(output) : null;

                    if (mediaData) {
                        const newWindow = window.open('', '_blank');
                        let mediaElement = '';

                        if (mediaType === 'image') {
                            const src = mediaData.startsWith('data:') ? mediaData : `data:image/png;base64,${mediaData}`;
                            mediaElement = `<img src="${src}" alt="Generated image" style="max-width:100%;max-height:80vh;border-radius:8px;"/>`;
                        } else if (mediaType === 'video') {
                            const src = mediaData.startsWith('data:') ? mediaData : `data:video/mp4;base64,${mediaData}`;
                            mediaElement = `<video controls style="max-width:100%;max-height:80vh;border-radius:8px;"><source src="${src}" type="video/mp4"></video>`;
                        } else if (mediaType === 'audio') {
                            const src = mediaData.startsWith('data:') ? mediaData : `data:audio/wav;base64,${mediaData}`;
                            mediaElement = `<audio controls><source src="${src}" type="audio/wav"></audio>`;
                        }

                        newWindow.document.write(`
                            <html>
                            <head><title>Job ${job.job_id}</title>
                            <style>body{margin:0;background:#fafafa;display:flex;flex-direction:column;align-items:center;padding:40px 20px;color:#1a1a1a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
                            h2{font-size:1.25rem;font-weight:600;margin-bottom:8px;}
                            p{color:#666;margin-bottom:24px;font-size:0.875rem;}
                            pre{background:#fff;border:1px solid #e0e0e0;padding:20px;border-radius:12px;max-width:800px;width:100%;overflow:auto;font-size:0.8rem;color:#555;}</style>
                            </head>
                            <body>
                            <h2>Job: ${job.job_id}</h2>
                            <p>${getServiceName(job.app_id)} &middot; ${job.status} &middot; ${new Date(job.created_at).toLocaleString()}</p>
                            ${mediaElement}
                            <h3 style="margin-top:24px;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.1em;color:#999;">Parameters</h3>
                            <pre>${JSON.stringify(job.params, null, 2)}</pre>
                            </body></html>
                        `);
                    } else {
                        alert(`Job Details:\n\nID: ${job.job_id}\nService: ${getServiceName(job.app_id)}\nStatus: ${job.status}\nCreated: ${new Date(job.created_at).toLocaleString()}\n\nPrompt: ${JSON.stringify(job.params, null, 2)}`);
                    }
                })
                .catch(err => {
                    console.error('Error fetching job details:', err);
                });
        }

        async function loadJobs() {
            const appId = document.getElementById('filterService').value;
            const status = document.getElementById('filterStatus').value;

            try {
                let url = `api/user/jobs`;
                const params = [];
                if (appId) params.push(`app_id=${appId}`);
                if (status) params.push(`status=${status}`);
                if (params.length) url += '?' + params.join('&');

                const response = await fetch(url, { headers: getAuthHeaders() });
                const data = await response.json();

                document.getElementById('jobCount').textContent = data.count;

                if (data.count === 0) {
                    document.getElementById('jobsGrid').innerHTML = '<div class="text-center text-[#aaa] py-12 col-span-full">No submissions found</div>';
                    return;
                }

                document.getElementById('jobsGrid').innerHTML = data.jobs.map(job => renderJobCard(job)).join('');

                const hasPendingJobs = data.jobs.some(j => j.status === 'PROCESSING' || j.status === 'QUEUED');
                if (hasPendingJobs) {
                    setTimeout(loadJobs, 5000);
                }
            } catch (error) {
                console.error('Error loading jobs:', error);
                document.getElementById('jobsGrid').innerHTML = '<div class="text-center text-red-500 py-12 col-span-full">Error loading jobs</div>';
            }
        }

        window.onload = function() {
            const username = getUsername();
            if (username) {
                document.getElementById('currentUsername').textContent = username;
            }
            loadJobs();
        };
    </script>
</body>

</html>
