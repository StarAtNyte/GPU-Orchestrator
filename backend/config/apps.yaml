apps:
  # Local GPU Worker Apps

  - id: "qwen35-chat"
    name: "Qwen3.5 Chat"
    type: "local"
    queue: "jobs:qwen35-chat"
    save_history: false
    description: "Chat with Qwen3.5-35B-A3B (MoE, 22GB Q4) — streaming via Redis Streams"
    gpu_vram_gb: 22
    docker_image: "backend-qwen35-chat-worker:latest"
    container_name: "qwen35-chat-worker"
    idle_timeout_seconds: 300
    startup_timeout_seconds: 180
    environment:
      MODEL_DIR: "/models"
      HF_REPO: "unsloth/Qwen3.5-35B-A3B-GGUF"
      MODEL_FILE: "Qwen3.5-35B-A3B-UD-Q4_K_XL.gguf"
      N_CTX: "16384"
      N_GPU_LAYERS: "46"
      IDLE_TIMEOUT: "300"

  - id: "gemma4-chat"
    name: "Gemma 4 Chat"
    type: "local"
    queue: "jobs:gemma4-chat"
    save_history: false
    description: "Chat with Gemma 4 26B-A4B (17GB Q4) — streaming via Redis Streams"
    gpu_vram_gb: 18
    docker_image: "backend-gemma4-chat-worker:latest"
    container_name: "gemma4-chat-worker"
    idle_timeout_seconds: 300
    startup_timeout_seconds: 180
    environment:
      MODEL_DIR: "/models"
      HF_REPO: "unsloth/gemma-4-26B-A4B-it-GGUF"
      MODEL_FILE: "gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf"
      N_CTX: "16384"
      N_GPU_LAYERS: "99"
      IDLE_TIMEOUT: "300"
      DISABLE_VISION: "true"
    parameters:
      - name: "messages"
        type: "string"
        required: true
        description: "JSON array of {role, content} messages"
      - name: "temperature"
        type: "string"
        required: false
        description: "Sampling temperature"
      - name: "top_p"
        type: "string"
        required: false
        description: "Top-P nucleus sampling"
      - name: "top_k"
        type: "string"
        required: false
        description: "Top-K sampling"
      - name: "max_tokens"
        type: "string"
        required: false
        description: "Maximum tokens to generate"
      - name: "presence_penalty"
        type: "string"
        required: false
        description: "Presence penalty (0–2)"
      - name: "enable_thinking"
        type: "string"
        required: false
        description: "Enable thinking mode: 'true' or 'false'"

  - id: "sdxl-image-gen"
    name: "SDXL Image Generator"
    type: "local"
    queue: "jobs:sdxl"
    description: "Generate high-quality images using Stable Diffusion XL"
    gpu_vram_gb: 12
    docker_image: "backend-sdxl-worker:latest"
    container_name: "sdxl-worker"
    idle_timeout_seconds: 300
    startup_timeout_seconds: 120
    parameters:
      - name: "prompt"
        type: "string"
        required: true
        description: "Text prompt for image generation"
      - name: "width"
        type: "integer"
        default: 1024
        description: "Image width in pixels"
      - name: "height"
        type: "integer"
        default: 1024
        description: "Image height in pixels"
      - name: "num_inference_steps"
        type: "integer"
        default: 50
        description: "Number of denoising steps"

  - id: "z-image"
    name: "Z-Image Generator"
    type: "local"
    queue: "jobs:z-image"
    description: "Fast image generation with Z-Image Turbo (single-stream diffusion transformer)"
    gpu_vram_gb: 16
    docker_image: "backend-z-image-worker:latest"
    container_name: "z-image-worker"
    idle_timeout_seconds: 300
    startup_timeout_seconds: 120
    parameters:
      - name: "prompt"
        type: "string"
        required: true
        description: "Text description (Chinese or English)"
      - name: "resolution"
        type: "string"
        required: false
        description: "Image resolution (1024x1024, 576x1024, 896x1200)"
      - name: "seed"
        type: "string"
        required: false
        description: "Random seed for reproducibility"
      - name: "steps"
        type: "string"
        required: false
        description: "Inference steps (20-100)"
      - name: "shift"
        type: "string"
        required: false
        description: "Time shift parameter (1.0-10.0)"

  - id: "qwen-image-edit"
    name: "Qwen Image Edit"
    type: "local"
    queue: "jobs:qwen-image-edit"
    description: "Edit images using Qwen-Image-Edit with 4-bit quantization and LoRA Lightning (~14s inference)"
    gpu_vram_gb: 12
    docker_image: "backend-qwen-image-edit-worker:latest"
    container_name: "qwen-image-edit-worker"
    idle_timeout_seconds: 300
    startup_timeout_seconds: 180
    environment:
      HF_HOME: "/models"
      TRANSFORMERS_CACHE: "/models"
    parameters:
      - name: "prompt"
        type: "string"
        required: true
        description: "Edit instruction (e.g., 'change rhino into tiger')"
      - name: "image_base64"
        type: "string"
        required: true
        description: "Base64 encoded input image"
      - name: "negative_prompt"
        type: "string"
        required: false
        description: "Things to avoid in the output"
      - name: "steps"
        type: "string"
        required: false
        description: "Inference steps (default: 4 with Lightning LoRA)"
      - name: "cfg_scale"
        type: "string"
        required: false
        description: "CFG scale (default: 1.0)"

  - id: "qwen-image-variations"
    name: "Qwen Image Variations"
    type: "local"
    queue: "jobs:qwen-image-variations"
    description: "Generate random variations of a person's image using Qwen-Image-Edit with curated prompts"
    gpu_vram_gb: 12
    docker_image: "backend-qwen-image-variations-worker:latest"
    container_name: "qwen-image-variations-worker"
    idle_timeout_seconds: 300
    startup_timeout_seconds: 180
    environment:
      HF_HOME: "/models"
      TRANSFORMERS_CACHE: "/models"
    parameters:
      - name: "image_base64"
        type: "string"
        required: true
        description: "Base64 encoded input image of a person"
      - name: "steps"
        type: "string"
        required: false
        description: "Inference steps (default: 4 with Lightning LoRA)"
      - name: "cfg_scale"
        type: "string"
        required: false
        description: "CFG scale (default: 1.0)"

  - id: "omnilottie"
    name: "OmniLottie"
    type: "local"
    queue: "jobs:omnilottie"
    description: "Convert text, images, or videos into Lottie animations using OmniLottie AI model"
    gpu_vram_gb: 12
    docker_image: "backend-omnilottie-worker:latest"
    container_name: "omnilottie-worker"
    idle_timeout_seconds: 300
    startup_timeout_seconds: 180
    environment:
      HF_HOME: "/models"
      TRANSFORMERS_CACHE: "/models"
    parameters:
      - name: "task_type"
        type: "string"
        required: true
        description: "Generation mode: 'text', 'image', or 'video'"
      - name: "prompt"
        type: "string"
        required: false
        description: "Text prompt or animation description"
      - name: "image_base64"
        type: "string"
        required: false
        description: "Base64 encoded input image (for image mode)"
      - name: "video_base64"
        type: "string"
        required: false
        description: "Base64 encoded input video (for video mode)"
      - name: "max_tokens"
        type: "string"
        required: false
        description: "Maximum tokens to generate (default: 5556)"
      - name: "use_sampling"
        type: "string"
        required: false
        description: "Enable sampling: 'true' or 'false' (default: true)"
      - name: "temperature"
        type: "string"
        required: false
        description: "Sampling temperature (default: 0.9)"
      - name: "top_p"
        type: "string"
        required: false
        description: "Top-P nucleus sampling (default: 0.25)"
      - name: "top_k"
        type: "string"
        required: false
        description: "Top-K sampling (default: 5)"

  # Cloud/Modal Apps
  - id: "panorama-processor"
    name: "360° Panorama Processor"
    type: "modal"
    endpoint: "https://your-org--panorama-processor.modal.run/process"
    description: "Process panoramic images with rug removal and outpainting"
    timeout_seconds: 1800
    parameters:
      - name: "operation"
        type: "string"
        required: true
        description: "Operation type: 'rug_removal' or 'outpaint'"
      - name: "image_data"
        type: "string"
        required: true
        description: "Base64 encoded image data"
      - name: "prompt"
        type: "string"
        required: false
        description: "Custom prompt for the operation"
      - name: "guidance_scale"
        type: "float"
        default: 7.5
        description: "Guidance scale for generation"



                                                                                                                                              