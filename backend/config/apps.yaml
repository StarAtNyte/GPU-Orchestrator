apps:
  # Local GPU Worker Apps
  - id: "sdxl-image-gen"
    name: "SDXL Image Generator"
    type: "local"
    queue: "jobs:sdxl"
    description: "Generate high-quality images using Stable Diffusion XL"
    gpu_vram_gb: 12
    docker_image: "backend-sdxl-worker:latest"
    container_name: "sdxl-worker"
    idle_timeout_seconds: 300
    startup_timeout_seconds: 120
    parameters:
      - name: "prompt"
        type: "string"
        required: true
        description: "Text prompt for image generation"
      - name: "width"
        type: "integer"
        default: 1024
        description: "Image width in pixels"
      - name: "height"
        type: "integer"
        default: 1024
        description: "Image height in pixels"
      - name: "num_inference_steps"
        type: "integer"
        default: 50
        description: "Number of denoising steps"

  - id: "z-image"
    name: "Z-Image Generator"
    type: "local"
    queue: "jobs:z-image"
    description: "Fast image generation with Z-Image Turbo (single-stream diffusion transformer)"
    gpu_vram_gb: 16
    docker_image: "backend-z-image-worker:latest"
    container_name: "z-image-worker"
    idle_timeout_seconds: 300
    startup_timeout_seconds: 120
    parameters:
      - name: "prompt"
        type: "string"
        required: true
        description: "Text description (Chinese or English)"
      - name: "resolution"
        type: "string"
        required: false
        description: "Image resolution (1024x1024, 576x1024, 896x1200)"
      - name: "seed"
        type: "string"
        required: false
        description: "Random seed for reproducibility"
      - name: "steps"
        type: "string"
        required: false
        description: "Inference steps (20-100)"
      - name: "shift"
        type: "string"
        required: false
        description: "Time shift parameter (1.0-10.0)"

  - id: "qwen-image-edit"
    name: "Qwen Image Edit"
    type: "local"
    queue: "jobs:qwen-image-edit"
    description: "Edit images using Qwen-Image-Edit with 4-bit quantization and LoRA Lightning (~14s inference)"
    gpu_vram_gb: 12
    docker_image: "backend-qwen-image-edit-worker:latest"
    container_name: "qwen-image-edit-worker"
    idle_timeout_seconds: 300
    startup_timeout_seconds: 180
    parameters:
      - name: "prompt"
        type: "string"
        required: true
        description: "Edit instruction (e.g., 'change rhino into tiger')"
      - name: "image_base64"
        type: "string"
        required: true
        description: "Base64 encoded input image"
      - name: "negative_prompt"
        type: "string"
        required: false
        description: "Things to avoid in the output"
      - name: "steps"
        type: "string"
        required: false
        description: "Inference steps (default: 4 with Lightning LoRA)"
      - name: "cfg_scale"
        type: "string"
        required: false
        description: "CFG scale (default: 1.0)"

  - id: "qwen-image-variations"
    name: "Qwen Image Variations"
    type: "local"
    queue: "jobs:qwen-image-variations"
    description: "Generate random variations of a person's image using Qwen-Image-Edit with curated prompts"
    gpu_vram_gb: 12
    docker_image: "backend-qwen-image-variations-worker:latest"
    container_name: "qwen-image-variations-worker"
    idle_timeout_seconds: 300
    startup_timeout_seconds: 180
    parameters:
      - name: "image_base64"
        type: "string"
        required: true
        description: "Base64 encoded input image of a person"
      - name: "steps"
        type: "string"
        required: false
        description: "Inference steps (default: 4 with Lightning LoRA)"
      - name: "cfg_scale"
        type: "string"
        required: false
        description: "CFG scale (default: 1.0)"

  # Cloud/Modal Apps
  - id: "panorama-processor"
    name: "360° Panorama Processor"
    type: "modal"
    endpoint: "https://your-org--panorama-processor.modal.run/process"
    description: "Process panoramic images with rug removal and outpainting"
    timeout_seconds: 1800
    parameters:
      - name: "operation"
        type: "string"
        required: true
        description: "Operation type: 'rug_removal' or 'outpaint'"
      - name: "image_data"
        type: "string"
        required: true
        description: "Base64 encoded image data"
      - name: "prompt"
        type: "string"
        required: false
        description: "Custom prompt for the operation"
      - name: "guidance_scale"
        type: "float"
        default: 7.5
        description: "Guidance scale for generation"



                                                                                                                                              