# GPU Orchestrator Backend - Ubuntu PC
# Runs orchestrator, workers, and infrastructure (PostgreSQL, Redis, etcd)

# version: '3.8' (obsolete)

services:
  # PostgreSQL - Job tracking
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: gpu-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orchestrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orchestrator}
      POSTGRES_DB: ${POSTGRES_DB:-gpu_orchestrator}
    ports:
      - "5433:5432"  # Using 5433 to avoid conflict with docmost
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orchestrator} -d ${POSTGRES_DB:-gpu_orchestrator}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Job queuing
  redis:
    image: redis:7-alpine
    container_name: gpu-redis
    ports:
      - "16379:6379"
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # etcd - Worker registry and service discovery
  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    container_name: gpu-etcd
    environment:
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
    ports:
      - "12379:2379"
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=localhost:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # GPU Orchestrator - Job routing
  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: gpu-orchestrator
    depends_on:
      - postgres
      - redis
      - etcd
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-orchestrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orchestrator}
      POSTGRES_DB: ${POSTGRES_DB:-gpu_orchestrator}
      REDIS_URL: redis:6379
      ETCD_ENDPOINT: etcd:2379
      APP_REGISTRY_PATH: /app/config/apps.yaml
      DOCKER_HOST: unix:///var/run/docker.sock
      NVIDIA_VISIBLE_DEVICES: all
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
    ports:
      - "8890:8080"
    volumes:
      - ./config/apps.yaml:/app/config/apps.yaml
      - ../scripts:/app/scripts
      - /var/run/docker.sock:/var/run/docker.sock:ro
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/workers"]
      interval: 10s
      timeout: 5s
      retries: 3

  # GPU Workers - Model inference
  sdxl-worker:
    build:
      context: .
      dockerfile: worker/sdxl_worker/Dockerfile
    container_name: sdxl-worker
    depends_on:
      - redis
      - postgres
      - etcd
      - orchestrator
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-orchestrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orchestrator}
      POSTGRES_DB: ${POSTGRES_DB:-gpu_orchestrator}
      ETCD_HOST: etcd
      ETCD_PORT: 2379
      ETCD_ENDPOINT: etcd:2379
      WORKER_ID: sdxl-worker
      APP_ID: sdxl-image-gen
      HF_TOKEN: ${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - backend-network
    restart: unless-stopped

  z-image-worker:
    build:
      context: .
      dockerfile: worker/z-image_worker/Dockerfile
    container_name: z-image-worker
    depends_on:
      - redis
      - postgres
      - etcd
      - orchestrator
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-orchestrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orchestrator}
      POSTGRES_DB: ${POSTGRES_DB:-gpu_orchestrator}
      ETCD_HOST: etcd
      ETCD_PORT: 2379
      ETCD_ENDPOINT: etcd:2379
      WORKER_ID: z-image-worker
      APP_ID: z-image
      HF_TOKEN: ${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - backend-network
    restart: unless-stopped

