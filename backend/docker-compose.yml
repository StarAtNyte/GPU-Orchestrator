      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-orchestrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-gpu_orchestrator}
      ETCD_HOST: etcd
      ETCD_PORT: 2379
      ETCD_ENDPOINT: etcd:2379
      WORKER_ID: qwen-image-edit-worker
